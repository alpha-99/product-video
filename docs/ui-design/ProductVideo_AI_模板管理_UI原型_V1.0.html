<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProductVideo AI · 模板管理补全 UI 原型 V1.0</title>
<style>
/* ============ Design Tokens：沿用 globals.css V1.1（OKLCH 暖调编辑风） ============ */
@font-face{font-family:"Fraunces";font-style:normal;font-weight:400 700;font-display:swap;src:url("../../public/fonts/fraunces-latin-var.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url("../../public/fonts/plus-jakarta-sans-latin-var.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --paper:oklch(97.5% .006 78);--paper-2:oklch(94.5% .01 78);--surface:oklch(100% 0 0);
  --ink:oklch(25% .022 58);--ink-2:oklch(43% .016 58);--ink-3:oklch(52% .012 58);
  --line:oklch(88% .012 75);--line-strong:oklch(80% .016 75);
  --brand:oklch(44% .068 155);--brand-deep:oklch(31% .052 155);--brand-soft:oklch(94% .022 155);--brand-tint:oklch(97.5% .01 155);
  --gold:oklch(74% .095 78);--gold-deep:oklch(58% .085 62);--gold-soft:oklch(95% .024 78);
  --success-soft:oklch(95% .03 150);--error-soft:oklch(96% .02 26);--warning-soft:oklch(96% .03 78);--info-soft:oklch(95% .025 235);
  --success-fg:oklch(52% .105 150);--info-fg:oklch(52% .09 235);--warning-fg:oklch(54% .085 62);--error-fg:oklch(54% .16 26);--error-solid:oklch(46% .16 26);
  --brand-fg:var(--brand);--focus-ring:var(--brand);
  --font-display:"Fraunces","Songti SC","STSong",Georgia,serif;
  --font-sans:"Plus Jakarta Sans",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs-xs:.72rem;--fs-sm:.82rem;--fs-base:.95rem;--fs-md:1.1rem;--fs-lg:1.5rem;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:26px;
  --shadow-1:0 1px 2px oklch(25% .02 58/.05);--shadow-2:0 8px 28px -12px oklch(25% .03 58/.18);
  --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="dark"]{
  --paper:oklch(17% .012 70);--paper-2:oklch(21% .015 70);--surface:oklch(23% .014 70);
  --ink:oklch(94% .008 75);--ink-2:oklch(78% .012 75);--ink-3:oklch(62% .012 70);
  --line:oklch(32% .014 70);--line-strong:oklch(40% .016 70);
  --brand-soft:oklch(28% .035 155);--brand-tint:oklch(22% .02 155);--gold-soft:oklch(28% .03 78);
  --success-soft:oklch(26% .04 150);--error-soft:oklch(27% .05 26);--warning-soft:oklch(28% .04 78);--info-soft:oklch(27% .04 235);
  --success-fg:oklch(70% .105 150);--info-fg:oklch(70% .09 235);--warning-fg:oklch(70% .085 62);--error-fg:oklch(70% .16 26);
  --brand-fg:oklch(74% .09 155);--focus-ring:oklch(74% .095 78);
  --shadow-1:0 1px 2px oklch(0 0 0/.3);--shadow-2:0 10px 30px -10px oklch(0 0 0/.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;padding-top:52px}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{font-weight:600}
.tabular{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:.76rem;line-height:1.5}

/* ============ 原型工具条（非产品 UI） ============ */
.proto-bar{position:fixed;inset:0 0 auto;height:52px;z-index:300;background:var(--brand-deep);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:var(--shadow-2)}
.proto-bar .pb-mark{font-family:var(--font-display);font-size:.95rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.proto-bar .pb-mark i{width:24px;height:24px;border-radius:6px;background:var(--gold);color:var(--brand-deep);display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:700}
.proto-bar select{min-height:34px;max-width:320px;padding:0 8px;border-radius:8px;border:1px solid oklch(100% 0 0/.35);background:oklch(100% 0 0/.12);color:#fff;font-size:.78rem;font-family:inherit}
.proto-bar select option{background:var(--brand-deep);color:#fff}
.proto-bar .pb-note{margin-left:auto;font-size:.72rem;opacity:.85;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proto-bar .pb-toggle{min-height:34px;padding:0 10px;border-radius:8px;border:1px solid oklch(100% 0 0/.35);background:transparent;color:#fff;font-size:.74rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.proto-bar .pb-toggle[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--brand-deep)}

/* ============ App shell ============ */
.app-body{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}
.app-side{background:var(--surface);border-right:1px solid var(--line);padding:var(--sp-6) 0;display:flex;flex-direction:column;position:sticky;top:52px;height:calc(100vh - 52px)}
.app-side .logo{padding:0 20px var(--sp-8);font-family:var(--font-display);font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.app-side .logo i{width:26px;height:26px;border-radius:7px;background:var(--brand-deep);color:var(--gold);display:grid;place-items:center;font-size:.8rem;font-style:normal}
.app-side nav{display:flex;flex-direction:column;gap:2px}
.app-side nav .nav-cap{padding:14px 20px 4px;font-size:.64rem;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.app-side nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;min-height:44px;font-size:.82rem;color:var(--ink-2);font-weight:600;border-left:3px solid transparent;transition:all .18s var(--ease)}
.app-side nav a .ico{width:18px;text-align:center;opacity:.85}
.app-side nav a:hover{background:var(--paper-2)}
.app-side nav a.active{background:var(--brand-tint);color:var(--brand-deep);border-left-color:var(--brand-fg)}
.app-side nav a.sub{padding-left:32px;font-size:.78rem}
.side-foot{margin-top:auto;padding:var(--sp-4) 20px;font-size:.72rem;color:var(--ink-3);border-top:1px solid var(--line)}
.side-foot b{color:var(--brand-fg)}
.top-nav-bar{display:none;position:sticky;top:52px;z-index:50;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top-nav-bar .tn-brand{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-family:var(--font-display);font-size:.9rem;font-weight:600}
.top-nav-bar .tn-brand i{width:24px;height:24px;border-radius:6px;background:var(--brand-deep);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:.72rem}
.top-nav-bar .tn-links{display:flex;flex-wrap:wrap;gap:2px}
.top-nav-bar .tn-links a{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 9px;border-radius:var(--r-sm);font-size:.74rem;font-weight:600;color:var(--ink-2)}
.top-nav-bar .tn-links a.active{background:var(--brand-tint);color:var(--brand-fg);box-shadow:inset 0 0 0 1px var(--brand-fg)}
.top-nav-bar .tn-account{margin-left:auto;display:flex;align-items:center;gap:6px}
.app-main{padding:clamp(20px,3vw,36px);min-width:0;max-width:1500px;width:100%}
.app-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:var(--sp-6);flex-wrap:wrap}
.app-top h1{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:500;line-height:1.3}
.top-ops{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,var(--gold),var(--gold-deep));color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}

/* ============ Base components ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;font-weight:600;font-size:.86rem;border:1px solid transparent;transition:all .2s var(--ease);white-space:nowrap}
.btn-primary{background:var(--brand-deep);color:#fff}.btn-primary:hover{background:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}.btn-ghost:hover{border-color:var(--brand-fg);color:var(--brand-fg)}
.btn-danger{background:var(--error-solid);color:#fff}.btn-danger:hover{filter:brightness(1.1)}
.btn-sm{min-height:44px;padding:0 14px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.icon-btn{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;font-size:.82rem}
.icon-btn:hover{border-color:var(--brand-fg);color:var(--brand-fg)}
.icon-btn.sm{width:40px;height:40px;min-width:40px;min-height:40px;font-size:.78rem}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.link-btn{min-height:44px;padding:0 8px;background:none;border:none;color:var(--brand-fg);font-size:.78rem;font-weight:700;display:inline-flex;align-items:center}
.link-btn:hover{text-decoration:underline}
.link-btn:disabled{color:var(--ink-3);cursor:not-allowed;text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:.74rem;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--success-soft);color:var(--success-fg)}
.badge.wait{background:var(--warning-soft);color:var(--warning-fg)}
.badge.fail{background:var(--error-soft);color:var(--error-fg)}
.badge.neutral{background:var(--paper-2);color:var(--ink-2)}
.badge.info{background:var(--info-soft);color:var(--info-fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-5)}
.stat{padding:var(--sp-5) var(--sp-6);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.stat .k{font-size:.7rem;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.stat .v{font-family:var(--font-display);font-size:2rem;line-height:1.15;margin-top:6px}
.stat .v small{font-size:.72rem;color:var(--ink-3);font-family:var(--font-sans);font-weight:500}
.stat.accent{background:linear-gradient(140deg,var(--brand-deep),var(--brand));color:#fff;border-color:transparent}
.stat.accent .k,.stat.accent .v small{color:oklch(100% 0 0/.82)}

/* ============ Banners / filters / tables ============ */
.boundary{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:var(--sp-4) var(--sp-5);border:1px solid var(--gold);border-radius:10px;background:var(--gold-soft);font-size:.82rem;margin-bottom:var(--sp-4)}
.boundary.danger{border-color:var(--error-fg);background:var(--error-soft)}
.boundary b{display:block;font-size:.84rem}.boundary span{color:var(--ink-2);font-size:.74rem;line-height:1.6}
.error-banner{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:var(--sp-4) var(--sp-5);border:1px solid var(--error-fg);border-radius:var(--r-md);background:var(--error-soft);color:var(--error-fg);font-size:.82rem;margin-bottom:var(--sp-4)}
.error-banner b{display:block;margin-bottom:2px}
.error-banner code{font-family:ui-monospace,monospace;font-size:.72rem;background:oklch(0 0 0/.07);padding:2px 6px;border-radius:4px}
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:var(--sp-4)}
.filter-bar input,.filter-bar select{min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:.8rem}
.filter-bar input[type="search"]{min-width:240px;flex:1;max-width:360px}
.filter-bar .spacer{flex:1}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.data-table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:980px}
.data-table th{text-align:left;padding:12px 14px;background:var(--paper-2);color:var(--ink-2);font-weight:700;font-size:.72rem;white-space:nowrap;border-bottom:1px solid var(--line)}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:var(--brand-tint)}
.reg-missing-row{background:var(--error-soft)}
.reg-missing-row td:first-child{box-shadow:inset 3px 0 0 var(--error-fg)}
.data-table tbody tr.reg-missing-row:hover{background:var(--error-soft)}
.data-table .main-cell b{display:block;font-size:.82rem}
.data-table .sub{font-size:.68rem;color:var(--ink-3);font-family:ui-monospace,monospace}
.row-ops{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.thumb{width:44px;height:64px;border-radius:7px;display:grid;place-items:center;overflow:hidden;color:#fff;font-size:.5rem;text-align:center;box-shadow:var(--shadow-1)}
.thumb.g1{background:linear-gradient(160deg,oklch(78% .06 78),oklch(48% .09 155))}
.thumb.g2{background:linear-gradient(160deg,oklch(85% .05 25),oklch(55% .1 30))}
.thumb.g3{background:linear-gradient(160deg,oklch(88% .03 155),oklch(45% .07 200))}
.thumb.g4{background:linear-gradient(160deg,oklch(90% .04 95),oklch(60% .09 65))}
.thumb.none{background:var(--paper-2);color:var(--ink-3);border:1px dashed var(--line-strong)}
.chip{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--paper-2);color:var(--ink-2);font-size:.7rem;font-weight:600}
.reg-ok{color:var(--success-fg);font-weight:700;font-size:.74rem}
.reg-bad{color:var(--error-fg);font-weight:700;font-size:.74rem;display:inline-flex;align-items:center;gap:5px}
.table-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;font-size:.74rem;color:var(--ink-3);flex-wrap:wrap}
.empty-state{padding:var(--sp-12) var(--sp-6);text-align:center;border:1px dashed var(--line-strong);border-radius:var(--r-md);color:var(--ink-3);background:var(--surface)}
.empty-state .em-ico{font-size:2rem;opacity:.5}.empty-state p{margin:var(--sp-3) 0 var(--sp-5);font-size:.85rem}

/* ============ Tabs（成员与角色） ============ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:var(--sp-5);overflow-x:auto}
.tab{min-height:48px;padding:0 16px;background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-2);font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tab:hover{color:var(--brand-fg)}
.tab[aria-selected="true"]{color:var(--brand-fg);border-bottom-color:var(--brand-fg)}
.tab .count{font-size:.68rem;background:var(--paper-2);color:var(--ink-2);padding:1px 7px;border-radius:99px}
.tab .count.hot{background:var(--error-soft);color:var(--error-fg)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--error-solid)}
.review-card{padding:var(--sp-5);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:var(--sp-3)}
.review-card.mine{border-style:dashed;background:var(--paper-2)}
.review-card.expired{opacity:.78}
.review-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.review-head b{font-size:.9rem}
.review-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;font-size:.76rem;color:var(--ink-2);margin-bottom:12px}
.review-meta span{color:var(--ink-3);display:block;font-size:.68rem}
.review-reason{font-size:.8rem;color:var(--ink-2);padding:10px 12px;border-radius:8px;background:var(--paper-2);margin-bottom:12px}

/* ============ Modal / Toast ============ */
.modal-mask{position:fixed;inset:0;z-index:200;background:oklch(20% .02 58/.45);display:grid;place-items:center;padding:20px}
.modal{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--sp-6)}
.modal.wide{width:min(780px,100%)}
.modal h2{font-family:var(--font-display);font-size:1.3rem;margin-bottom:var(--sp-2);line-height:1.4}
.modal h2:focus{outline:none}
.modal .lede{font-size:.78rem;color:var(--ink-3);margin-bottom:var(--sp-6)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:var(--sp-6);padding-top:var(--sp-4);border-top:1px solid var(--line);position:sticky;bottom:-24px;background:var(--surface);flex-wrap:wrap;z-index:2}
.form-section{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-5);margin-bottom:var(--sp-4)}
.form-section h3{font-size:.85rem;margin-bottom:var(--sp-4);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-deep)}
.tag.ro{background:var(--paper-2);color:var(--ink-3)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.78rem;font-weight:700}
.field input,.field textarea,.field select{min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-size:.84rem;font-family:inherit}
.field textarea{resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brand-fg);box-shadow:0 0 0 3px var(--brand-soft)}
.field input:disabled{background:var(--paper-2);color:var(--ink-3)}
.field .hint{font-size:.68rem;color:var(--ink-3);line-height:1.5}
.field.full{grid-column:1/-1}
.readonly-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.readonly-grid div{padding:10px 12px;border-radius:8px;background:var(--paper-2)}
.readonly-grid span{display:block;font-size:.66rem;color:var(--ink-3);margin-bottom:2px}
.readonly-grid code{font-size:.78rem;font-weight:700;font-family:ui-monospace,monospace}
.modal-note{font-size:.72rem;color:var(--ink-3);padding:10px 12px;border-left:3px solid var(--brand-fg);background:var(--brand-tint);border-radius:0 8px 8px 0;line-height:1.6}
.warn-box{border:1px solid var(--warning-fg);background:var(--warning-soft);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-4);font-size:.8rem}
.warn-box b{display:block;margin-bottom:6px}
.warn-box ul{margin:0;padding-left:18px;line-height:1.9}
.confirm-input{margin-top:12px}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:var(--sp-5)}
.result-grid div{text-align:center;padding:var(--sp-4) 8px;border-radius:10px;background:var(--paper-2)}
.result-grid b{display:block;font-family:var(--font-display);font-size:1.5rem}
.result-grid span{font-size:.68rem;color:var(--ink-3)}
.audit-list{display:flex;flex-direction:column;gap:12px}
.audit-item{position:relative;padding-left:20px;border-left:2px solid var(--line-strong)}
.audit-item::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand-fg)}
.audit-item .t{font-size:.68rem;color:var(--ink-3)}

const MODALS = {
  "tpl-edit":modalEdit,"tpl-disable":modalDisable,"tpl-thumb":modalThumb,"tpl-sync":modalSync,"tpl-audit":modalTplAudit,"tpl-sort":modalSort,
  "usr-request":modalRequest,"usr-revoke":modalRevoke,"usr-approve":modalApprove,"reject":modalReject
};

/* ============================================================
   渲染 / 交互调度
   ============================================================ */
function render(){
  const main = document.getElementById("mainContent");
  if(currentScene==="tpl-normal"||currentScene==="tpl-last"||currentScene==="tpl-empty") main.innerHTML = viewTemplates(currentScene.split("-")[1]);
  else if(currentScene==="usr-list"||currentScene==="usr-review"||currentScene==="usr-audit") main.innerHTML = viewUsers(currentScene.split("-")[1]);
  else if(currentScene.indexOf("err-")===0) main.innerHTML = viewStatePage(currentScene);
  else if(currentScene==="front") main.innerHTML = viewFront();
  else main.innerHTML = viewTemplates("normal");
  document.querySelectorAll("[data-nav]").forEach(function(el){el.classList.toggle("active",el.dataset.nav===activeNav());});
}
function openModal(key){
  lastFocused = document.activeElement;
  document.getElementById("modalRoot").innerHTML = MODALS[key]();
  const dlg = document.querySelector('.modal [tabindex="-1"]');
  if(dlg) dlg.focus();
}
function closeModal(skipSync){
  document.getElementById("modalRoot").innerHTML="";
  if(lastFocused && document.contains(lastFocused))lastFocused.focus();
  if(!skipSync && MODALS[activeSceneKey]){
    activeSceneKey = currentScene;
    document.getElementById("sceneSelect").value = activeSceneKey;
    document.getElementById("sceneNote").textContent = SCENES[activeSceneKey]?SCENES[activeSceneKey].note:"";
  }
}
function toast(msg,isError){
  const el = document.createElement("div");
  el.className = "toast"+(isError?" error":"");
  el.textContent = msg;
  document.getElementById("toastRoot").appendChild(el);
  setTimeout(function(){el.remove();},3600);
}
function switchScene(key,skipHash){
  closeModal(true);
  activeSceneKey = key;
  currentScene = MODALS[key] ? (key.indexOf("usr-")===0?"usr-list":"tpl-normal") : key;
  document.getElementById("sceneSelect").value = key;
  document.getElementById("sceneNote").textContent = SCENES[key]?SCENES[key].note:"";
  render();
  if(MODALS[key]) openModal(key);
  try{history.replaceState(null,"","#"+key);}catch(e){}
  window.scrollTo({top:0,behavior:"auto"});
}

function bind(){
  const sel = document.getElementById("sceneSelect");
  let html = "", lastGroup = "";
  Object.keys(SCENES).forEach(function(k){
    if(SCENES[k].group!==lastGroup){if(lastGroup)html+="</optgroup>";lastGroup=SCENES[k].group;html+='<optgroup label="'+lastGroup+'">';}
    html += '<option value="'+k+'">'+SCENES[k].label+'</option>';
  });
  html += "</optgroup>";
  sel.innerHTML = html;
  sel.value = currentScene;
  sel.addEventListener("change",function(){switchScene(this.value);});

  document.getElementById("annoToggle").addEventListener("click",function(){
    const on = document.body.classList.toggle("anno-on");
    this.setAttribute("aria-pressed",String(on));
  });
  document.getElementById("themeToggle").addEventListener("click",function(){
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme")!=="dark";
    root.setAttribute("data-theme",dark?"dark":"light");
    this.setAttribute("aria-pressed",String(dark));
    this.textContent = dark?"◑ 浅色":"◐ 暗色";
  });

  document.addEventListener("click",function(e){
    const tab = e.target.closest("[data-tab]");
    if(tab){currentTab = tab.dataset.tab;switchScene("usr-"+currentTab);return;}
    const nav = e.target.closest("[data-nav]");
    if(nav){e.preventDefault();if(nav.dataset.nav==="users-admin")switchScene("usr-list");else if(nav.dataset.nav==="templates-admin")switchScene("tpl-normal");else if(nav.dataset.nav==="templates")switchScene("front");else switchScene("err-403");return;}
    const el = e.target.closest("[data-action]");
    if(!el)return;
    const a = el.dataset.action;
    switch(a){
      case "mask": if(e.target===el)closeModal();break;
      case "close": closeModal();break;
      case "theme": document.getElementById("themeToggle").click();break;
      case "logout": switchScene("err-401");break;
      case "back": switchScene("usr-list");break;
      case "dismiss": el.closest(".error-banner").remove();break;
      case "edit": openModal("tpl-edit");break;
      case "disable": openModal("tpl-disable");break;
      case "thumb": openModal("tpl-thumb");break;
      case "sync": openModal("tpl-sync");break;
      case "tpl-audit": openModal("tpl-audit");break;
      case "sort": openModal("tpl-sort");break;
      case "request": openModal("usr-request");break;
      case "revoke": openModal("usr-revoke");break;
      case "approve": openModal("usr-approve");break;
      case "reject": openModal("reject");break;
      case "go-audit": switchScene("usr-audit");break;
      case "cancel-req": toast("已撤回申请（Should 级能力）");break;
      case "saved": closeModal();toast("保存成功 · 前台 60s 内生效，已写入审计");break;
      case "disabled-ok": closeModal();toast("模板已停用 · 已失效前台缓存；retry 不受影响");break;
      case "upload-ok": closeModal();toast("缩略图上传成功");break;
      case "request-ok": closeModal();toast("提权申请已提交 · 等待另一名管理员复核");break;
      case "revoke-ok": closeModal();toast("已撤销管理员权限 · 角色审计已记录");break;
      case "approve-ok": closeModal();toast("批准成功 · C 已成为管理员，审计恰好 1 条");break;
      case "reject-ok": closeModal();toast("已驳回申请");break;
      case "retry-ok": toast("重试成功 · 任务已回到 pending（不受模板停用影响）");break;
      case "noop": toast("历史任务使用快照，不回读模板元数据");break;
    }
  });

  document.addEventListener("input",function(e){
    if(e.target.id==="f-revoke-email"){
      const ok = e.target.value.trim()==="backup.admin@productvideo.cn";
      const btn = document.querySelector('[data-action="revoke-ok"]');
      if(btn)btn.disabled = !ok;
    }
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&document.getElementById("modalRoot").innerHTML)closeModal();
    if(e.key==="Tab"&&document.getElementById("modalRoot").innerHTML){
      const f = Array.from(document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select')).filter(function(x){return !x.disabled;});
      if(!f.length)return;
      const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
}

bind();
(function(){
  if(new URLSearchParams(location.search).get("dark")==="1"){
    document.documentElement.setAttribute("data-theme","dark");
    const tt=document.getElementById("themeToggle");
    tt.setAttribute("aria-pressed","true");tt.textContent="◑ 浅色";
  }
  const hk = decodeURIComponent(location.hash.slice(1));
  if(hk && SCENES[hk]) switchScene(hk,true);
  else if(hk && MODALS[hk]) switchScene(hk,true);
  else {render();document.getElementById("sceneNote").textContent=SCENES[currentScene].note;}
})();
window.addEventListener("hashchange",function(){
  const hk = decodeURIComponent(location.hash.slice(1));
  if(hk && SCENES[hk] && hk!==activeSceneKey) switchScene(hk,true);
});
</script>
</body>
