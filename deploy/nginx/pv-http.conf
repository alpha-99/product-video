# /etc/nginx/conf.d/pv-http.conf
# http 级配置（必须放在 http 块内，不能写进 server 块）。
# 方案 12.3「Nginx 全局限流」+ 方案 11「结构化日志」。

limit_req_zone $binary_remote_addr zone=pv_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=pv_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=pv_write:10m rate=20r/m;
limit_req_status 429;

log_format pv_json escape=json
  '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"rt":$request_time,"upstream_rt":"$upstream_response_time",'
  '"ua":"$http_user_agent","xff":"$http_x_forwarded_for"}';
