# /etc/nginx/sites-available/product-video
# setup-vps.sh 会把 __DOMAIN__ / __PORT__ 替换后启用；certbot --nginx 会自动追加 443 块。
# 注意：data 目录绝不映射为静态目录，成片下载必须走 /api/videos/:id/download 鉴权。

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 方案 9.3：单图上限 10MB，这里留 1MB 余量给 multipart 边界。
    client_max_body_size 11m;
    client_body_timeout 120s;

    access_log /var/log/nginx/product-video.access.log pv_json;
    error_log  /var/log/nginx/product-video.error.log warn;

    # Certbot HTTP-01 校验（--domain 模式需要）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # 禁止暴露隐藏文件（.env / .git / .next 等）
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
    location ^~ /data/ {
        deny all;
        access_log off;
    }

    # 健康检查：精确匹配优先于 /api/，不记访问日志、不参与写限流。
    # 配置了 HEALTH_TOKEN 时接口自身要求 x-health-token 头。
    location = /api/health {
        include /etc/nginx/snippets/pv-proxy.conf;
        proxy_pass http://127.0.0.1:__PORT__;
        access_log off;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/pv-proxy.conf;
        proxy_pass http://127.0.0.1:__PORT__;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 写接口（上传 / 提交 / AI 文案）单独收紧，方案 5.2 全局限流兜底。
    location ~ ^/api/(uploads|videos|products|ai)/ {
        limit_req zone=pv_write burst=10 nodelay;
        include /etc/nginx/snippets/pv-proxy.conf;
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location /api/ {
        limit_req zone=pv_api burst=30 nodelay;
        include /etc/nginx/snippets/pv-proxy.conf;
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location / {
        limit_req zone=pv_general burst=60 nodelay;
        include /etc/nginx/snippets/pv-proxy.conf;
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
